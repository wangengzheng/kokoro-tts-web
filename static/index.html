<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kokoro TTS · 英文语音合成</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    [v-cloak] { display: none; }
    .fade-in { animation: fadeIn .4s ease-out; }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @media (prefers-reduced-motion: reduce) {
      .fade-in { animation: none; }
    }
  </style>
</head>
<body class="min-h-screen bg-gradient-to-br from-slate-50 via-cyan-50 to-slate-100 text-slate-800">

  <!-- 顶部导航 -->
  <header class="border-b border-slate-200/70 bg-white/70 backdrop-blur sticky top-0 z-10">
    <div class="max-w-3xl mx-auto px-4 py-4 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <div class="w-9 h-9 rounded-xl bg-gradient-to-br from-cyan-500 to-blue-600 flex items-center justify-center text-white shadow-lg shadow-cyan-500/30">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M19 11a7 7 0 01-7 7m0 0a7 7 0 01-7-7m7 7v4m0-4a3 3 0 003-3V5a3 3 0 00-6 0v10a3 3 0 003 3z"/>
          </svg>
        </div>
        <div>
          <h1 class="text-lg font-bold tracking-tight">Kokoro TTS</h1>
          <p class="text-xs text-slate-500">英文文本转语音 · 本地合成</p>
        </div>
      </div>
      <span id="statusDot" class="flex items-center gap-1.5 text-xs text-slate-500">
        <span class="w-2 h-2 rounded-full bg-slate-300"></span> 检查中…
      </span>
    </div>
  </header>

  <main class="max-w-3xl mx-auto px-4 py-8">
    <!-- 输入卡片 -->
    <section class="bg-white rounded-2xl shadow-xl shadow-slate-200/60 border border-slate-200/60 p-6">
      <label for="textInput" class="block text-sm font-semibold text-slate-700 mb-2">
        英文文本 <span class="font-normal text-slate-400">（支持多行，最多 5000 字符）</span>
      </label>
      <textarea
        id="textInput"
        rows="6"
        maxlength="5000"
        placeholder="Type or paste English text here… e.g. Our planet is facing serious environmental challenges."
        class="w-full rounded-xl border border-slate-300 px-4 py-3 text-sm leading-relaxed resize-y
               focus:outline-none focus:ring-2 focus:ring-cyan-500/60 focus:border-cyan-500
               placeholder:text-slate-400 transition"
      ></textarea>

      <div class="flex items-center justify-between mt-2 text-xs text-slate-400">
        <span id="charCount">0 / 5000</span>
        <span>Enter 换行 · ⌘/Ctrl + Enter 生成</span>
      </div>

      <!-- 选项行 -->
      <div class="mt-4 grid grid-cols-1 sm:grid-cols-2 gap-4">
        <div>
          <label for="voiceSelect" class="block text-xs font-medium text-slate-500 mb-1">音色 Voice</label>
          <select id="voiceSelect"
            class="w-full rounded-lg border border-slate-300 px-3 py-2 text-sm bg-white
                   focus:outline-none focus:ring-2 focus:ring-cyan-500/60 focus:border-cyan-500">
            <option value="af_heart">af_heart · 女声（默认）</option>
            <option value="af_bella">af_bella · 女声</option>
            <option value="am_michael">am_michael · 男声</option>
            <option value="am_fenrir">am_fenrir · 男声</option>
            <option value="bf_emma">bf_emma · 英音女声</option>
            <option value="bm_george">bm_george · 英音男声</option>
          </select>
        </div>
        <div>
          <label for="speedRange" class="block text-xs font-medium text-slate-500 mb-1">
            语速 Speed：<span id="speedValue" class="font-semibold text-cyan-600">1.0x</span>
          </label>
          <input id="speedRange" type="range" min="0.5" max="2" step="0.1" value="1"
            class="w-full accent-cyan-600 mt-2" />
        </div>
      </div>

      <!-- 生成按钮 -->
      <button id="generateBtn"
        class="mt-6 w-full py-3 rounded-xl font-semibold text-white text-sm
               bg-gradient-to-r from-cyan-500 to-blue-600
               hover:from-cyan-600 hover:to-blue-700
               focus:outline-none focus:ring-4 focus:ring-cyan-500/40
               disabled:opacity-50 disabled:cursor-not-allowed
               transition shadow-lg shadow-cyan-500/25">
        <span id="btnText">🎙️ 生成语音</span>
      </button>

      <!-- 错误提示 -->
      <div id="errorBox" class="hidden mt-4 rounded-xl bg-red-50 border border-red-200 px-4 py-3 text-sm text-red-700 flex items-start gap-2" role="alert">
        <svg class="w-4 h-4 mt-0.5 shrink-0" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v4m0 4h.01M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z"/>
        </svg>
        <span id="errorText"></span>
      </div>
    </section>

    <!-- 结果卡片 -->
    <section id="resultCard" class="hidden mt-6 bg-white rounded-2xl shadow-xl shadow-slate-200/60 border border-slate-200/60 p-6 fade-in" aria-live="polite">
      <div class="flex items-center justify-between mb-4">
        <h2 class="text-sm font-semibold text-slate-700 flex items-center gap-2">
          <svg class="w-4 h-4 text-green-500" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"/>
          </svg>
          生成成功
        </h2>
        <span id="resultMeta" class="text-xs text-slate-400"></span>
      </div>

      <!-- 内嵌播放器 -->
      <audio id="audioPlayer" controls class="w-full" preload="metadata"></audio>

      <!-- 链接行 -->
      <div class="mt-4 flex flex-wrap items-center gap-3">
        <a id="downloadLink" href="#" download
          class="inline-flex items-center gap-2 px-4 py-2 rounded-lg text-sm font-semibold text-white
                 bg-emerald-500 hover:bg-emerald-600 focus:outline-none focus:ring-4 focus:ring-emerald-500/30 transition">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M4 16v2a2 2 0 002 2h12a2 2 0 002-2v-2M7 10l5 5 5-5M12 15V3"/>
          </svg>
          下载 WAV
        </a>
        <a id="openLink" href="#" target="_blank" rel="noopener"
          class="inline-flex items-center gap-2 px-4 py-2 rounded-lg text-sm font-medium text-cyan-700
                 bg-cyan-50 hover:bg-cyan-100 border border-cyan-200 transition">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"/>
          </svg>
          在新标签页打开
        </a>
        <span id="fileUrl" class="text-xs text-slate-400 truncate max-w-full"></span>
      </div>
    </section>

    <!-- 历史记录 -->
    <section id="historySection" class="hidden mt-6">
      <h2 class="text-sm font-semibold text-slate-600 mb-3">🕘 历史记录（本次会话）</h2>
      <ul id="historyList" class="space-y-2"></ul>
    </section>
  </main>

  <footer class="max-w-3xl mx-auto px-4 py-8 text-center text-xs text-slate-400">
    Powered by <a href="https://github.com/hexgrad/kokoro" target="_blank" rel="noopener" class="text-cyan-600 hover:underline">Kokoro-82M</a>
    · Flask + TailwindCSS · 24kHz WAV
  </footer>

  <script>
    const $ = (id) => document.getElementById(id);
    const textInput = $('textInput'), charCount = $('charCount');
    const generateBtn = $('generateBtn'), btnText = $('btnText');
    const errorBox = $('errorBox'), errorText = $('errorText');
    const resultCard = $('resultCard'), audioPlayer = $('audioPlayer');
    const downloadLink = $('downloadLink'), openLink = $('openLink'), fileUrl = $('fileUrl'), resultMeta = $('resultMeta');
    const voiceSelect = $('voiceSelect'), speedRange = $('speedRange'), speedValue = $('speedValue');
    const statusDot = $('statusDot');
    const historySection = $('historySection'), historyList = $('historyList');

    let generating = false;
    const history = [];

    // ---- 字数统计 ----
    textInput.addEventListener('input', () => {
      charCount.textContent = `${textInput.value.length} / 5000`;
    });

    // ---- 语速显示 ----
    speedRange.addEventListener('input', () => {
      speedValue.textContent = `${parseFloat(speedRange.value).toFixed(1)}x`;
    });

    // ---- 快捷键 ⌘/Ctrl + Enter ----
    textInput.addEventListener('keydown', (e) => {
      if ((e.metaKey || e.ctrlKey) && e.key === 'Enter') {
        e.preventDefault();
        generate();
      }
    });

    // ---- 健康检查 ----
    fetch('/api/health').then(r => r.json()).then(d => {
      statusDot.innerHTML = d.model_loaded
        ? '<span class="w-2 h-2 rounded-full bg-green-500"></span> 模型已就绪'
        : '<span class="w-2 h-2 rounded-full bg-amber-400"></span> 服务在线 · 模型待加载';
    }).catch(() => {
      statusDot.innerHTML = '<span class="w-2 h-2 rounded-full bg-red-400"></span> 服务离线';
    });

    // ---- 生成 ----
    async function generate() {
      const text = textInput.value.trim();
      if (!text) { showError('请输入英文文本'); textInput.focus(); return; }
      if (generating) return;

      generating = true;
      hideError();
      generateBtn.disabled = true;
      btnText.innerHTML = '<span class="inline-flex items-center gap-2"><svg class="w-4 h-4 animate-spin" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v4a4 4 0 00-4 4H4z"></path></svg>合成中，请稍候…</span>';

      const start = performance.now();
      try {
        const res = await fetch('/api/tts', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            text,
            voice: voiceSelect.value,
            speed: parseFloat(speedRange.value),
          }),
        });
        const data = await res.json();

        if (!res.ok || !data.success) {
          throw new Error(data.error || `请求失败 (${res.status})`);
        }

        const elapsed = ((performance.now() - start) / 1000).toFixed(1);
        showResult(data, elapsed);
        addHistory(data, text);
      } catch (err) {
        showError(err.message || '网络错误，请重试');
      } finally {
        generating = false;
        generateBtn.disabled = false;
        btnText.textContent = '🎙️ 生成语音';
      }
    }

    generateBtn.addEventListener('click', generate);

    // ---- 结果展示 ----
    function showResult(data, elapsed) {
      audioPlayer.src = data.url;
      downloadLink.href = data.download_url;
      openLink.href = data.url;
      fileUrl.textContent = data.url;
      resultMeta.textContent = `时长 ${data.duration}s · 耗时 ${elapsed}s`;
      resultCard.classList.remove('hidden');
      resultCard.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    }

    function addHistory(data, text) {
      history.unshift({ ...data, text });
      historySection.classList.remove('hidden');
      renderHistory();
    }

    function renderHistory() {
      historyList.innerHTML = history.map((h, i) => `
        <li class="bg-white rounded-xl border border-slate-200/60 px-4 py-3 flex items-center gap-3 hover:border-cyan-300 transition">
          <button data-play="${i}" class="shrink-0 w-8 h-8 rounded-full bg-cyan-100 text-cyan-700 hover:bg-cyan-200 flex items-center justify-center" aria-label="播放">
            <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
          </button>
          <div class="min-w-0 flex-1">
            <p class="text-sm text-slate-700 truncate">${h.text.replace(/</g, '&lt;').slice(0, 80)}</p>
            <p class="text-xs text-slate-400">${h.duration}s · ${h.filename}</p>
          </div>
          <a href="${h.download_url}" download class="shrink-0 text-xs font-medium text-emerald-600 hover:text-emerald-700">下载</a>
        </li>
      `).join('');

      historyList.querySelectorAll('[data-play]').forEach(btn => {
        btn.addEventListener('click', () => {
          const h = history[+btn.dataset.play];
          audioPlayer.src = h.url;
          resultCard.classList.remove('hidden');
          audioPlayer.play();
        });
      });
    }

    // ---- 错误处理 ----
    function showError(msg) {
      errorText.textContent = msg;
      errorBox.classList.remove('hidden');
    }
    function hideError() {
      errorBox.classList.add('hidden');
    }

    textInput.focus();
  </script>
</body>
</html>
